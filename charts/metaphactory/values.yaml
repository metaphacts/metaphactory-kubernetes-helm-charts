environment: development
container:
  name: metaphactory
  port: 8080
  image: metaphacts/metaphactory
  tag: 6.0.0
  imagePullSecretName: regcred
  credentialsSecretName: credentials
  persistentVolumeSize: 1Gi
  # Size for the dedicated log volume (Only created if jettyRequestLogIni is set)
  logsVolumeSize: 1Gi
  # JMX Agent Image (legacy path)
  # Used with config.jmx_java_tool_options to inject the javaagent via
  # JAVA_TOOL_OPTIONS.
  # DEPRECATED: Prefer config.jmxExporter.enabled with config.jmxExporter.port
  # and config.jmxExporter.configPath instead.
  # The init container copies the JMX agent jar from this image into /apps/jmx/
  # before Metaphactory starts when legacy mode is used.
  # Optionally set config.jmxIni to also enable Jetty-specific MBeans.
  # Example Configuration:
  # jmx_image: "your-registry/jmx-agent:1.5.0"
  jmx_image: ""
  resources:
    limits:
      #cpu: 500m
      memory: 2Gi
    requests:
      #cpu: 200m
      memory: 1Gi
  readinessProbe:
    httpGet:
      path: /rest/status
      port: 8080
    initialDelaySeconds: 120
    failureThreshold: 10
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /rest/status
      port: 8080
    failureThreshold: 3
    periodSeconds: 120
  affinity: {}
  envFrom: []
#appsFromVolumes:
#  - name: skinapp
#    configMap:
#      name: skinapp
#      items:
#      - key: "assets--logo.svg"
#        path: "assets/logo.svg"
#      - key: "config--page-layout--footer.hbs"
#        path: "config/page-layout/footer.hbs"
config:
  localDefaultUsers: |
    [users]
    admin=$shiro1$SHA-256$500000$JWFyxDbrkcdlGl6Xpj02dg==$UYbUG3bHmT8Z4dTeEHToK5WdyvwR9cRefiM/9zRjfr4=,admin,root
    anonymous=$shiro1$SHA-256$500000$LRgzF+Iayekl6VfDVkåVWIA==$/s38LlLsNeaGzsD0Z3VTvfurv68HpReieOaNlrcKaPI=,end-user,tableau-anonymous
  ssoOidcParams: |
    [main]
    discoveryURI.value = https://login.microsoftonline.com/customer-tenant-id/v2.0/.well-known/openid-configuration
    callbackUrl.value = https://metaphacts.example.com/sso/callback?client_name=OidcClient
    clientId.value = 12345678-1234-abcd-1234-1234abcd5678
    clientSecret.value = ABcdEFghIJklMN12Op34QRs5TUVwXYZaBcDeFgH6IJK7LmNoPq
    scope.value = openid email profile offline_access
    principalNameAttribute.value = preferred_username
    defaultRole.value = guest
    rolesClaimAttribute.value = roles
    scopeRolesMap.value = "admin":"admin,root,repository-admin","reader":"guest","writer":"admin"
  ssoUsers: |
    [users]
    #myuser@example.com = admin,root,repository-admin
  pluginProperties: |
    plugin.id=config-app
    plugin.provider=Devops
    plugin.version=1.0.0
  environmentProp: |
    shiroAuthenticationFilter=authcBasic,oidc
    enableLocalUsers=true
  # Add custom roles if required (helpful for SSO) - the key of the key-value pair will be the name of the role
  #customRoles:
  #  customUserRole: |
  #    description=Custom user role
  #    includes=system-base, monitoring
  #    permissions = \
  #        ontologies:*:*, \
  #        sparql:graphstore:get, \
  #        assets:view:ontology, \
  #        assets:api:list-services, \
  #        proxy:graphscope, \
  #        vocabularies:catalog:view, \
  #        vocabularies:*:vocabulary:view, \
  #        assets:view:vocabulary
  #  secondUserRole: |
  #    description=Another Custom user role
  #    includes=system-base, monitoring

  env:
    PLATFORM_OPTS: >-
      -Dlog4j.configurationFile=file:///var/lib/jetty/webapps/etc/log4j2.xml
      -Dconfig.environment.securityConfigStorageId=config-app
  storage_prop: ""
  ui_prop: ""
  namespaces_prop: ""
  assets_prop: ""
  ai_services_prop: ""
  aws_services_prop: ""
  eia_physical_prop: ""
  # Content for /var/lib/jetty/start.d/custom.ini
  jettyCustomIni: |
    # jetty.httpConfig.idleTimeout=30000

  # Jetty Request Log Configuration
  # To enable request logging (and create the dedicated storage volume),
  # uncomment the block below and remove the empty string definition.
  #
  # Example Configuration:
  # jettyRequestLogIni: |
  #   --module=requestlog
  #   jetty.requestlog.dir=logs
  #   jetty.requestlog.filePath=${jetty.requestlog.dir}/yyyy_mm_dd.request.log
  #   jetty.requestlog.retainDays=7
  #   jetty.requestlog.formatString=%{client}a - %u %{dd/MMM/yyyy:HH:mm:ss ZZZ|UTC}t "%r" %s %O %{ms}Tms traceparent=%{traceparent}i

  # Leave as empty string "" to DISABLE jetty logs and prevent volume creation.
  jettyRequestLogIni: ""

  # Leave as empty string "" to DISABLE jetty statistics.
  jettyStatisticsIni: ""
  # Jetty JMX Module - enables Jetty internals as JMX MBeans (thread pools, connectors, request stats).
  # When combined with jmx_java_tool_options (legacy) or config.jmxExporter (preferred),
  # these MBeans are also exposed as Prometheus metrics.
  # Example Configuration:
  # jmxIni: |
  #   --module=jmx
  # Leave as empty string "" to DISABLE Jetty JMX module.
  jmxIni: ""
  # JMX Java Tool Options (legacy path)
  # Part 2 of the legacy JMX setup - see also container.jmx_image above.
  # DEPRECATED: Prefer config.jmxExporter.* below instead. Only needed together
  # with container.jmx_image; attaches the copied agent jar via JAVA_TOOL_OPTIONS.
  # Example Configuration:
  # jmx_java_tool_options: "-javaagent:/apps/jmx/jmx_prometheus_javaagent-1.5.0.jar=9404:/apps/jmx/config.yaml"
  jmx_java_tool_options: ""

  # JMX Metrics Configuration
  # To enable JMX/Prometheus metrics, set jmxExporter.enabled to true and
  # uncomment the port and configPath settings below.
  # Activates the JMX Prometheus agent on the Metaphactory JVM.
  # Metrics will be exposed at the set port e.g. :9404/metrics once both settings are configured.
  # If config is left empty, the chart renders a curated default allowlist from
  # templates/_jmx-exporter-config.tpl.
  # Set config to your own YAML block to override that default rule set.
  jmxExporter:
    enabled: false
    # port: 9404
    # configPath: /jmx-exporter/config.yaml
    # config: |
    #   # Optional override for the default allowlist from
    #   # templates/_jmx-exporter-config.tpl.
    #   lowercaseOutputName: true
service:
  portName: http
  port: 80
  targetPort: 8080
  type: LoadBalancer # or ClusterIP or NodePort
  metricsPortName: metrics
  metricsPort: 9404
replicas: 1
database:
  defaultDatabaseName: metaphactory
  assetsDatabaseName: assets
  assetsSecurityStrategy: assets
  testsDatabaseName: tests
  repositoryType: "metaphactory:GraphDBRepository"
  address: http://graphdb.default.svc.cluster.local:7200 # http://<service>.<namespace>:7200
# If you need to tweak the TTL files for the database connection beyond the
# options above, you can use rawDatabaseConfig for one or all repositories
# rawDatabaseConfig:
#   default: |
#     @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#>.
#     …
#   assets: |
#     @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#>.
#     …
#   tests: |
#     @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#>.
#     …
storage:
  customAwsClass: false # creates a custom StorageClass for AWS
  #storageClass: "" # set the storage class, e.g. 'default' for the default storage class or 'hostpath' for Docker Desktop
  reclaimPolicy: Retain
ingress:
  enabled: false
  groupName: lb-group-name
  name: metaphactory-ingress-tls
  certificateArn: certificate-arn
  ingressClass: alb
  host: test.example.com
  enableSSLRedirect: true

monitoring:
  serviceMonitor:
    enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # path: /metrics
    # labels: {
    #   release: kube-prometheus-stack
    # }

# Ontopic suite (optional). Powers the mapping/virtualization capabilities of the
# Semantic Layer: AI-assisted R2RML mapping authoring and SPARQL-over-SQL endpoints.
# Disabled by default - set `enabled: true` to deploy the 6 Ontopic Pods alongside
# metaphactory. Ontopic is reverse-proxied through metaphactory's bundled app and
# is never directly exposed via its own Ingress - all Ontopic Services are
# ClusterIP-only and (by default) further restricted via NetworkPolicy so that only
# metaphactory and the other Ontopic pods that need to talk to each other can reach
# them. NOTE: NetworkPolicy is only enforced if your cluster's CNI implements it
# (Calico, Cilium, most managed-cloud CNIs do; plain Flannel does not - unsupported
# NetworkPolicy objects are silently never enforced, with no error). See README.md.
ontopic:
  enabled: false

  networkPolicy:
    # Restricts which Ontopic pods may be contacted by which other pods (see README
    # for the full allow-list matrix). Leave enabled unless your cluster's CNI
    # doesn't support NetworkPolicy (in which case this has no effect either way).
    enabled: true

  # Shared repository/tag suffix for the 5 metaphacts-built Ontopic images
  # (angular-frontend, process-server, store-server, ontopic-server, ai-server).
  # store-server-db uses the separate community postgres image below instead.
  repository: metaphacts/ontopic
  version: "6.0.0"

  storage:
    # Reuses the same convention as the top-level `storage.storageClass`: leave
    # empty for the cluster default storage class, or set to "-" to omit
    # storageClassName entirely (e.g. for the default class on some clusters).
    storageClass: ""

  angularFrontend:
    # Full image override; defaults to "{repository}:studio-{version}" if empty.
    image: ""
    resources: {}
    env:
      urlPrefix: /ontopic
      webApiUrl: /ontopic/api-ui/
      isDemoVersion: false
      hideProjects: false
      isDesktopVersion: false
      enableDataCollection: false
      disableProjectCreation: true
      disableProjectDeletion: false
      disableOntologyEditing: true
      disableDataSourceEditing: true
    # Additional raw environment variables, e.g. [{name: ENDPOINT_ORIGIN, value: "https://example.com"}]
    extraEnv: []

  processServer:
    # Full image override; defaults to "{repository}:process-server-{version}" if empty.
    image: ""
    resources: {}
    env:
      enablePrefixImport: false
    extraEnv: []
    # JDBC drivers needed to connect to relational sources (process-server does not
    # ship any). Configure exactly one of the two options below:
    jdbc:
      # Preferred for production/air-gapped clusters: reference a PVC you populated
      # once yourself (e.g. `kubectl cp` the jars in), mounted read-only at
      # /app/jdbc. No runtime network dependency. Leave empty to use `urls` instead.
      existingClaim: ""
      # Convenience fallback for quick dev/eval use: downloaded by an initContainer
      # (which reuses the metaphactory image, already cached on the node, since it
      # already has curl installed) into an emptyDir on every pod start. Ignored if
      # existingClaim is set. Add one entry per relational source you plan to map.
      urls: []

  storeServer:
    # Full image override; defaults to "{repository}:store-server-{version}" if empty.
    image: ""
    resources: {}
    # Name of an externally-created Secret (see README) with a `db-password` key,
    # shared with storeServerDb below.
    secretName: ontopic-store-secrets
    persistence:
      docsSize: 5Gi
      reposSize: 5Gi
    env:
      enableSemanticSql: true
      ontopicSampleDb: true
      enableGitRepo: false
      enableMaterialization: false
      enableScopes: true
      enableAuthentication: false
    extraEnv: []

  storeServerDb:
    image: postgres
    tag: "18.4"
    resources: {}
    persistence:
      size: 10Gi
    # Name of an externally-created Secret with a `db-password` key (same secret
    # as storeServer.secretName by default - both just need that one key).
    secretName: ontopic-store-secrets

  ontopicServer:
    # Full image override; defaults to "{repository}:ontopic-server-{version}" if empty.
    image: ""
    resources: {}
    ports:
      webApi: 8080
      # Postgres wire protocol port. Cluster-internal only - unlike the docker-compose
      # module (which binds this to 127.0.0.1 on the host for admin convenience),
      # there is no reason to expose it outside the pod's ClusterIP Service at all.
      postgresWire: 4300
    env:
      corsAllowedOrigins: ""
      logLevel: INFO
      enableMaterialization: false
    extraEnv: []
    persistence:
      endpointSize: 5Gi
      endpointSecuritySize: 1Gi
      materializationDbSize: 5Gi
      materializationConfigurationSize: 1Gi
      materializationResultSize: 5Gi
    # JDBC drivers for the relational sources being mapped. The H2 driver below is
    # REQUIRED - ontopic-server uses H2 as its internal metadata store and will not
    # start without it. Configure exactly one of the two options below:
    jdbc:
      # Preferred for production/air-gapped clusters: reference a PVC you populated
      # once yourself, mounted read-only at /opt/ontopic-server/jdbc. Leave empty to
      # use `urls` instead. Must still include the H2 driver.
      existingClaim: ""
      # Convenience fallback for quick dev/eval use: downloaded by an initContainer
      # (reusing the metaphactory image) into an emptyDir on every pod start.
      # Ignored if existingClaim is set. Append further entries (e.g. PostgreSQL,
      # MSSQL, Oracle, Snowflake) for each relational source you plan to map.
      urls:
        - name: h2
          url: https://repo1.maven.org/maven2/com/h2database/h2/2.3.232/h2-2.3.232.jar
    # Name of an externally-created Secret (see README) with keys s3-access-key-id,
    # s3-access-key-secret, azure-account-name, azure-account-key, azure-sas-token.
    # Leave empty to run without blob-storage-backed materialization.
    blobStorageSecretName: ""

  aiServer:
    # Full image override; defaults to "{repository}:ai-server-{version}" if empty.
    image: ""
    resources: {}
    env:
      llmMode: real
      aiEngine: langchain
      llmBaseUrl: ""
      llmModels: ""
    extraEnv: []
    # Name of an externally-created Secret (see README) with keys openai-api-key,
    # anthropic-api-key, llm-additional-headers. Leave empty to run without any LLM
    # keys - ai-server still starts, but the AI assistant cannot answer.
    secretName: ""
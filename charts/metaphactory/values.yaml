environment: development
container:
  name: metaphactory
  port: 8080
  image: metaphacts/metaphactory
  tag: 6.1.0
  imagePullSecretName: regcred
  credentialsSecretName: credentials
  persistentVolumeSize: 1Gi
  # Size for the dedicated log volume (Only created if jettyRequestLogIni is set)
  logsVolumeSize: 1Gi
  # JMX Agent Image (legacy path)
  # Used with config.jmx_java_tool_options to inject the javaagent via
  # JAVA_TOOL_OPTIONS.
  # DEPRECATED: Prefer config.jmxExporter.enabled with config.jmxExporter.port
  # and config.jmxExporter.configPath instead.
  # The init container copies the JMX agent jar from this image into /apps/jmx/
  # before Metaphactory starts when legacy mode is used.
  # Optionally set config.jmxIni to also enable Jetty-specific MBeans.
  # Example Configuration:
  # jmx_image: "your-registry/jmx-agent:1.5.0"
  jmx_image: ""
  resources:
    limits:
      #cpu: 500m
      memory: 2Gi
    requests:
      #cpu: 200m
      memory: 1Gi
  readinessProbe:
    httpGet:
      path: /rest/status
      port: 8080
    initialDelaySeconds: 120
    failureThreshold: 10
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /rest/status
      port: 8080
    failureThreshold: 3
    periodSeconds: 120
  affinity: {}
  envFrom: []
  # JDBC drivers for metaphactory (activates the bundled `jdbc-drivers` app).
  # The datasource wizard's "Test Connection" runs in the metaphactory pod, so
  # drivers must be provisioned here. Either a pre-populated PVC
  # (existingClaim, mounted read-only) or urls fetched by an init container
  # on every pod start.
  jdbc:
    existingClaim: ""
    urls: []
    # - name: databricks
    #   url: https://repo1.maven.org/maven2/com/databricks/databricks-jdbc/3.4.2/databricks-jdbc-3.4.2.jar

# Configurations for the ServiceAccount for metaphactory.
# The service account tokens can be used as OIDC federated web identity tokens
# for authentication in cloud APIs (e.g. AWS S3 via EKS Pod Identity).
# Ref: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a ServiceAccount should be created for metaphactory.
  create: false
  # - If not set and create is true, a name is generated using the release name
  # - If set and create is true, it will use the provided name
  # - If set but create is false, it will use the provided, externally managed ServiceAccount
  # - If not set and create is false, serviceAccountName is not rendered at all
  #   (the pod implicitly uses the namespace default service account)
  name: ""
  # Additional annotations for the created ServiceAccount (e.g. for Pod Identity)
  annotations: {}

#appsFromVolumes:

{{- /* JDBC drivers for the bundled jdbc-drivers app; nil-safe for --reuse-values upgrades */}}
{{- $jdbc := .Values.container.jdbc | default dict }}
{{- $jdbcEnabled := or $jdbc.existingClaim $jdbc.urls }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.container.name }}
  labels:
    app: {{ .Values.container.name }}
spec:
  serviceName: {{.Values.container.name | quote }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.container.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.container.name }}
      {{- if $jdbcEnabled }}
      annotations:
        # drivers load at startup; roll the pod when the list changes
        checksum/jdbc: {{ $jdbc | toYaml | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.container.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 101
      {{- $sa := .Values.serviceAccount | default dict }}
      {{- if or $sa.create $sa.name }}
      serviceAccountName: {{ $sa.name | default .Release.Name | quote }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
      - env:
        - name: SECRET_REPOSITORY_PASSWORD
          valueFrom:
           secretKeyRef:
            name: {{ .Values.container.credentialsSecretName }}
            key: repository.password
        - name: SECRET_REPOSITORY_USERNAME
          valueFrom:
           secretKeyRef:
            name: {{ .Values.container.credentialsSecretName }}
            key: repository.username
        - name: PLATFORM_OPTS
          value: {{ (.Values.config.env |default dict).PLATFORM_OPTS | quote }}
        {{- if .Values.config.ai_services_prop }}
        - name: MP_APP_AISERVICES
          value: /bundled/apps/ai-services
        {{- end }}
        {{- if .Values.config.aws_services_prop }}
        - name: MP_APP_AWSSERVICES
          value: /bundled/apps/aws-services
        {{- end }}
        {{- if .Values.config.eia_physical_prop }}
        - name: MP_APP_EIA_PHYSICAL_LAYER
          value: /bundled/apps/eia-physical-layer
        {{- end }}
        {{- if .Values.knowledgeExtractor.enabled }}
        - name: MP_APP_KNOWLEDGE_EXTRACTOR
          value: /bundled/apps/knowledge-extractor
        {{- end }}
        {{- if $jdbcEnabled }}
        - name: MP_APP_JDBC
          value: /bundled/apps/jdbc-drivers
        {{- end }}
        {{- if .Values.config.jmx_java_tool_options }}
        - name: JAVA_TOOL_OPTIONS
          value: {{ .Values.config.jmx_java_tool_options }}
        {{- end }}
        {{- if .Values.config.jmxExporter.enabled }}
        - name: JMX_EXPORTER_PORT
          value: {{ required "config.jmxExporter.port is required when config.jmxExporter.enabled is true" .Values.config.jmxExporter.port | quote }}
        - name: JMX_EXPORTER_CONFIG
          value: {{ required "config.jmxExporter.configPath is required when config.jmxExporter.enabled is true" .Values.config.jmxExporter.configPath | quote }}
        {{- end }}
        {{- with .Values.container.envFrom }}
        envFrom: {{- toYaml . | nindent 10 }}
        {{- end }}
        image: {{ .Values.container.image }}:{{ .Values.container.tag }}
        name: {{ .Values.container.name }}
        {{- with .Values.container.resources }}
        resources: {{ toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.container.readinessProbe }}
        readinessProbe: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.container.livenessProbe }}
        livenessProbe: {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - mountPath: /runtime-data
          name: {{ .Values.container.name }}-runtime-data
        - mountPath: /apps
          name: {{ .Values.container.name }}-apps
        - mountPath: /storage
          name: {{ .Values.container.name }}-storage
        {{- if .Values.knowledgeExtractor.enabled }}
        - mountPath: /storage/documents
          name: knowledge-extractor-document-storage
        - mountPath: /storage/vocabularies
          name: knowledge-extractor-vocabulary-storage
        - mountPath: /storage/temp-documents
          name: {{ .Values.container.name }}-temp-document-storage
        {{- end }}
        - name: config-app
          mountPath: "/apps/config-app"
          readOnly: true
        {{- if $jdbcEnabled }}
        - name: jdbc-drivers
          mountPath: /bundled/apps/jdbc-drivers/lib
          readOnly: true
        {{- end }}
        {{- if .Values.config.jettyCustomIni }}
        - name: jetty-custom-config
          mountPath: /var/lib/jetty/start.d/custom.ini
          subPath: custom.ini
        {{- end }}
        {{- if .Values.config.jettyRequestLogIni }}
        - name: jetty-requestlog-config
          mountPath: /var/lib/jetty/start.d/requestlog.ini
          subPath: requestlog.ini
        {{- end }}
        {{- if .Values.config.jettyStatisticsIni }}
        - name: jetty-statistics-config
          mountPath: /var/lib/jetty/start.d/statistics.ini
          subPath: statistics.ini
        {{- end }}
        {{- if .Values.config.jettyRequestLogIni }}
        - name: {{ .Values.container.name }}-jetty-logs
          mountPath: /var/lib/jetty/logs
        {{- end }}
        {{- if .Values.config.jmxIni }}
        - name: jetty-jmx-config
          mountPath: /var/lib/jetty/start.d/jmx.ini
          subPath: jmx.ini
        {{- end }}
        {{- if .Values.config.jmxExporter.enabled }}
        - name: jmx-exporter-config
          mountPath: {{ required "config.jmxExporter.configPath is required when config.jmxExporter.enabled is true" .Values.config.jmxExporter.configPath | quote }}
          subPath: config.yaml
          readOnly: true
        {{- end }}
        {{- with .Values.appsFromVolumes }}
        {{- range $app := . }}
        - name: {{ $app.name }}
          mountPath: "/apps/{{ $app.name }}"
          readOnly: true
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.container.port }}
          protocol: TCP
      initContainers:
      - image: {{ .Values.container.image }}:{{ .Values.container.tag }}
        name: {{ .Values.container.name }}-config-init
        command: ["cp","-r","-n","/runtime-data/.","/runtime-target/"]
        volumeMounts:
        - mountPath: /runtime-target
          name: {{ .Values.container.name }}-runtime-data
      {{- if .Values.container.jmx_image }}
      - image: {{ .Values.container.jmx_image }}
        name: jmx-init
        command: ["sh","-c","mkdir -p /apps/jmx && cp /copyfile/agent/* /apps/jmx"]
        volumeMounts:
        - mountPath: /apps
          name: {{ .Values.container.name }}-apps
      {{- end }}
      {{- if and $jdbc.urls (not $jdbc.existingClaim) }}
      # Downloads the configured JDBC driver jars into the jdbc-drivers app.
      - image: {{ .Values.container.image }}:{{ .Values.container.tag }}
        name: {{ .Values.container.name }}-jdbc-init
        command: ["/bin/sh", "-ec"]
        args:
          - |
            {{- range $driver := $jdbc.urls }}
            echo "Fetching JDBC driver '{{ $driver.name }}'"
            curl -fsSL --retry 3 -o "/jdbc-target/{{ $driver.name }}.jar" "{{ $driver.url }}"
            {{- end }}
            ls -l /jdbc-target
        volumeMounts:
        - mountPath: /jdbc-target
          name: jdbc-drivers
      {{- end }}
      imagePullSecrets:
      - name: {{ .Values.container.imagePullSecretName }}
      volumes:
      - name: config-app
        configMap:
          name: metaphactory-config
          items:
          - key: "environment.prop"
            path: "config/environment.prop"
          - key: "shiro-sso-oidc-params.ini"
            path: "config/shiro-sso-oidc-params.ini"
          - key: "shiro-sso-users.ini"
            path: "config/shiro-sso-users.ini"
          {{- if .Values.database.enabled }}
          - key: "repository-config"
            path: "config/repositories/default.ttl"
          - key: "repository-assets-config"
            path: "config/repositories/assets.ttl"
          - key: "repository-tests-config"
            path: "config/repositories/tests.ttl"
          {{- end }}
          - key: "shiro.ini"
            path: "config/shiro.ini"
          - key: "storage.prop"
            path: "config/storage.prop"
          - key: "ui.prop"
            path: "config/ui.prop"
          - key: "namespaces.prop"
            path: "config/namespaces.prop"
          - key: "assets.prop"
            path: "config/assets.prop"
          - key: "aws-services.prop"
            path: "config/aws-services.prop"
          {{- if .Values.knowledgeExtractor.enabled }}
          - key: "ocpConfig.prop"
            path: "config/ocpConfig.prop"
          {{- end }}
          {{- range $roleName, $roleContent := .Values.config.customRoles }}
          - key: "role-{{ $roleName }}.prop"
            path: "config/roles/role-{{ $roleName }}.prop"
          {{- end }}
          - key: "plugin.properties"
            path: "plugin.properties"
      {{- if $jdbcEnabled }}
      - name: jdbc-drivers
        {{- if $jdbc.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ $jdbc.existingClaim }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
      {{- if .Values.config.jettyCustomIni }}
      - name: jetty-custom-config
        configMap:
          name: metaphactory-config
          items:
          - key: "custom.ini"
            path: "custom.ini"
      {{- end }}
      {{- if .Values.config.jmxIni }}
      - name: jetty-jmx-config
        configMap:
          name: metaphactory-config
          items:
          - key: "jmx.ini"
            path: "jmx.ini"
      {{- end }}
      {{- if .Values.config.jmxExporter.enabled }}
      - name: jmx-exporter-config
        configMap:
          name: metaphactory-config
          items:
            - key: "jmx-exporter-config.yaml"
              path: "config.yaml"
      {{- end }}
      {{- if .Values.config.jettyRequestLogIni }}
      - name: jetty-requestlog-config
        configMap:
          name: metaphactory-config
          items:
          - key: "requestlog.ini"
            path: "requestlog.ini"
      {{- end }}
      {{- if .Values.config.jettyStatisticsIni }}
      - name: jetty-statistics-config
        configMap:
          name: metaphactory-config
          items:
          - key: "statistics.ini"
            path: "statistics.ini"
      {{- end }}
      {{- with .Values.appsFromVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if .Values.knowledgeExtractor.enabled }}
      - name: knowledge-extractor-document-storage
        persistentVolumeClaim:
          claimName: knowledge-extractor-document-storage
      - name: knowledge-extractor-vocabulary-storage
        persistentVolumeClaim:
          claimName: knowledge-extractor-vocabulary-storage
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.container.name }}-runtime-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.storage.storageClass }}
      {{- if (eq "-" .Values.storage.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ .Values.storage.storageClass }}"
      {{- end }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.container.persistentVolumeSize }}
  - metadata:
      name: {{ .Values.container.name }}-apps
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.storage.storageClass }}
      {{- if (eq "-" .Values.storage.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ .Values.storage.storageClass }}"
      {{- end }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.container.persistentVolumeSize }}
  - metadata:
      name: {{ .Values.container.name }}-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.storage.storageClass }}
      {{- if (eq "-" .Values.storage.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ .Values.storage.storageClass }}"
      {{- end }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.container.persistentVolumeSize }}
  {{- if .Values.config.jettyRequestLogIni }}
  - metadata:
      name: {{ .Values.container.name }}-jetty-logs
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.storage.storageClass }}
      {{- if (eq "-" .Values.storage.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ .Values.storage.storageClass }}"
      {{- end }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.container.logsVolumeSize }}
  {{- end }}
  {{- if .Values.knowledgeExtractor.enabled }}
  - metadata:
      name: {{ .Values.container.name }}-temp-document-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.storage.storageClass }}
      {{- if (eq "-" .Values.storage.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: "{{ .Values.storage.storageClass }}"
      {{- end }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.knowledgeExtractor.tempDocumentStorage.size }}
  {{- end }}
